# SIMPAC — stack completo. Levantar con:  docker compose up --build
# Necesita un archivo .env en la raíz (copia .env.docker.example).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]   # solo la propia máquina (no la red local / wifi)

  backend:                       # API async (FastAPI)
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SNAPSHOT_TTL: ${SNAPSHOT_TTL:-900}
      SIMPAC_CORS_ORIGENES: ${SIMPAC_CORS_ORIGENES:-}   # vacío = la web local y la app (backend/config.py)
    ports: ["8000:8000"]
    depends_on: [redis]

  worker:                        # ingesta + caché (Celery worker + beat) + cargador de mapas FEN
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALAR_MAPAS: "1"          # geopandas solo en esta imagen
    restart: unless-stopped
    command: celery -A backend.celery_app worker --beat --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      SIMPAC_LLUVIA_DEPTS: ${SIMPAC_LLUVIA_DEPTS:-cajamarca}
      SNAPSHOT_TTL: ${SNAPSHOT_TTL:-900}
      SIMPAC_LLM_KEY: ${SIMPAC_LLM_KEY:-}               # vacío = titular por reglas, sin pedidos externos
      SIMPAC_LLM_MODELO: ${SIMPAC_LLM_MODELO:-}
      FIREBASE_CREDENCIALES: ${FIREBASE_CREDENCIALES:-}   # vacío = la tarea push no envía nada (solo latido)
      FIREBASE_PROYECTO: ${FIREBASE_PROYECTO:-}
      # Con FIREBASE_CREDENCIALES_ARCHIVO (ruta en el host al JSON de la cuenta de servicio) el archivo
      # se monta abajo de solo lectura y esta variable le dice al worker dónde quedó (backend/config.py);
      # sin ella queda vacía y se monta un JSON vacío versionado para que Docker no cree una carpeta.
      FIREBASE_CREDENCIALES_MONTADA: ${FIREBASE_CREDENCIALES_ARCHIVO:+/run/secrets/firebase.json}
    volumes:
      - "${FIREBASE_CREDENCIALES_ARCHIVO:-./.firebase-vacio.json}:/run/secrets/firebase.json:ro"
    depends_on: [redis]

  frontend:                      # React build servido por nginx
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [backend]
