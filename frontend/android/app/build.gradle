apply plugin: 'com.android.application'

// Firma de la version release. Los datos del keystore NO se versionan: se leen de
// android/key.properties (ver appmobile/README.md) o, si no existe, de variables de entorno
// SIMPAC_KEYSTORE_FILE, SIMPAC_KEYSTORE_PASSWORD, SIMPAC_KEY_ALIAS, SIMPAC_KEY_PASSWORD.
// Sin ninguno de los dos, el release se compila sin firmar (y el debug sigue igual).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def firmaStoreFile = keystoreProperties['storeFile'] ?: System.getenv("SIMPAC_KEYSTORE_FILE")
def firmaStorePassword = keystoreProperties['storePassword'] ?: System.getenv("SIMPAC_KEYSTORE_PASSWORD")
def firmaKeyAlias = keystoreProperties['keyAlias'] ?: System.getenv("SIMPAC_KEY_ALIAS")
def firmaKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv("SIMPAC_KEY_PASSWORD")
def hayFirma = firmaStoreFile && firmaStorePassword && firmaKeyAlias && firmaKeyPassword

android {
    namespace = "pe.simpac.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pe.simpac.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            // "!*.gz": el build de Vite deja un .gz al lado de cada .js/.css (para nginx); el WebView no los
            // usa y al empaquetar AAPT los toma como duplicados de los archivos sin .gz (mergeDebugAssets falla).
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.gz'
        }
    }
    signingConfigs {
        release {
            if (hayFirma) {
                storeFile rootProject.file(firmaStoreFile)
                storePassword firmaStorePassword
                keyAlias firmaKeyAlias
                keyPassword firmaKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hayFirma) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
