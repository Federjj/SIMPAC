# nginx que sirve la build de Vite (frontend/Dockerfile). Es una SPA estática: todo lo que no sea un
# archivo cae en index.html. La app lee Supabase y los tiles directo desde el navegador: aquí no hay
# proxy ni API.
#
# Entrega: el JS pesa ~835 KB sin comprimir y ~256 KB con gzip. El build deja cada .js/.css/.svg con
# su .gz al lado (vite.config.js, plugin precomprimir): gzip_static lo sirve sin gastar CPU y, si no
# existe, gzip lo comprime al vuelo. Los archivos de /assets/ llevan un hash en el nombre: un año de
# caché sin revalidar; index.html, el manifest y el service worker siempre se revalidan (no-cache).
#
# Las cabeceras de seguridad van en cada bloque que agrega las suyas: en nginx un add_header dentro de
# un location anula los del server, así que se repiten (bloque CABECERAS) para no perderlos.
#
# Validar sin reconstruir la imagen:
#   docker run --rm -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Sin registro de accesos: no se guardan direcciones IP de quienes visitan (privacidad).
  access_log off;

  # el manifest de la PWA no está en el mime.types de nginx:alpine
  types {
    application/manifest+json webmanifest;
  }
  include /etc/nginx/mime.types;

  # --- compresión ---
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_static on;

  # --- CABECERAS: seguridad (se repiten en cada location que agrega cabeceras) ---
  # CSP: scripts solo propios; estilos propios e inline (Leaflet y los marcadores ponen style=""), más
  # las fuentes de Google; datos de Supabase (también por WebSocket, para la sesión); imágenes del
  # mapa base (Stadia), de la lluvia satelital (NASA GIBS, también una consulta HEAD) y del WMS de
  # SENAMHI (IDESEP), y data:/blob: para los glifos de los marcadores.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://tiles.stadiamaps.com https://gibs.earthdata.nasa.gov https://idesep.senamhi.gob.pe https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://tiles.stadiamaps.com https://gibs.earthdata.nasa.gov; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # SPA: todas las rutas caen en index.html (la redirección interna vuelve a pasar por los location,
  # así que /ruta termina con las cabeceras de "location = /index.html")
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Build con hash en el nombre: un año y sin revalidar. Lo que no existe es 404 (nunca index.html
  # con tipo de script).
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://tiles.stadiamaps.com https://gibs.earthdata.nasa.gov https://idesep.senamhi.gob.pe https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://tiles.stadiamaps.com https://gibs.earthdata.nasa.gov; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  # index.html, el manifest y el service worker: siempre se revalidan (así un despliegue nuevo se ve
  # en la siguiente visita; los assets que nombra ya llevan otro hash)
  location ~ ^/(index\.html|manifest\.webmanifest|sw\.js)$ {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://tiles.stadiamaps.com https://gibs.earthdata.nasa.gov https://idesep.senamhi.gob.pe https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://tiles.stadiamaps.com https://gibs.earthdata.nasa.gov; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }
}
