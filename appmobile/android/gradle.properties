# Ajustes de Gradle para el proyecto Android de SIMPAC.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Direcciones de la API y de la web que la app trae de fabrica (BuildConfig.API_URL / WEB_URL; se
# pueden cambiar en Cuenta > Ajustes). Sin definirlas, el debug apunta al Docker de la PC desde el
# emulador (http://10.0.2.2:8000 y http://10.0.2.2:8080) y el release NO compila: hay que darlas aqui
# o por linea de comandos, siempre por https (red_release.xml no permite http hacia un dominio real):
#   .\gradlew.bat bundleRelease -Psimpac.apiUrl=https://<api>.up.railway.app -Psimpac.webUrl=https://<web>.vercel.app
# simpac.apiUrl=https://<api>.up.railway.app
# simpac.webUrl=https://<web>.vercel.app
